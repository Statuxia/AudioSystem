services:
 silo-init:
  image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
  environment:
   - MINIO_ROOT_USER=silo-s3
   - MINIO_ROOT_PASSWORD=abcdefghijklmnopqrstuvwxyz
   - MINIO_PRESIGNED_USER=silo-presigned
   - MINIO_PRESIGNED_PASSWORD=abcdefghijklmnop
  entrypoint: ["/bin/sh", "-c"]
  command: |
    mc alias set silo http://silo:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD &&
    mc mb --ignore-existing silo/client-sources &&
    mc mb --ignore-existing silo/job-results &&
    cat > /tmp/policy.json <<'EOF'
    {
    "Version": "2012-10-17",
    "Statement": [
      {
        "Effect": "Allow",
        "Action": ["s3:GetObject"],
        "Resource": ["arn:aws:s3:::job-results/*"]
      }
    ]
    }
    EOF &&
    mc admin user add silo $MINIO_PRESIGNED_USER $MINIO_PRESIGNED_PASSWORD &&
    mc admin policy create silo job-results-read /tmp/policy.json &&
    mc admin policy attach silo job-results-read --user $MINIO_PRESIGNED_USER
  depends_on:
   silo:
    condition: service_healthy
 silo:
  image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
  ports:
   - "9000:9000"
  environment:
   - MINIO_ROOT_USER=silo-s3
   - MINIO_ROOT_PASSWORD=abcdefghijklmnopqrstuvwxyz
  volumes:
   - silo_data:/data
  healthcheck:
   test: ["CMD", "mc", "ready", "local"]
   interval: 30s
   start_period: 30s
  networks:
   - s3
  command: server /data --console-address ":9001"
 api:
  environment:
   - MINIO_SERVER=silo:9000
   - MINIO_PORT=9000
   - MINIO_ROOT_USER=silo-s3
   - MINIO_ROOT_PASSWORD=abcdefghijklmnopqrstuvwxyz
   - MINIO_CLIENT_BUCKET_NAME=client-sources
   - MINIO_RESULT_BUCKET_NAME=job-results
   - MINIO_PRESIGNED_USER=silo-presigned
   - MINIO_PRESIGNED_PASSWORD=abcdefghijklmnop
  networks:
   - s3
volumes:
 silo_data:
networks:
 s3:
  driver: bridge
