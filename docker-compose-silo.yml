services:
 silo-init:
  image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
  environment:
   - MINIO_ROOT_USER=${AUDIOSYSTEM_SILO_ROOT_USER}
   - MINIO_ROOT_PASSWORD=${AUDIOSYSTEM_SILO_ROOT_PASSWORD}
   - MINIO_PRESIGNED_USER=${AUDIOSYSTEM_SILO_PRESIGNED_USER}
   - MINIO_PRESIGNED_PASSWORD=${AUDIOSYSTEM_SILO_PRESIGNED_PASSWORD}
  entrypoint: ["/bin/sh", "-c"]
  command:
   - |
    mc alias set silo http://silo:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
    mc mb --ignore-existing silo/client-sources &&
    mc mb --ignore-existing silo/job-results &&
    mc ilm add --expiry-days 1 silo/client-sources &&
    mc ilm add --expiry-days 1 silo/job-results &&
    cat > /tmp/policy.json <<'EOF'
    {
    "Version": "2012-10-17",
    "Statement": [
      {
        "Effect": "Allow",
        "Action": ["s3:GetObject"],
        "Resource": ["arn:aws:s3:::job-results/*"]
      }
    ]
    }
    EOF
    mc admin user add silo $$MINIO_PRESIGNED_USER $$MINIO_PRESIGNED_PASSWORD &&
    mc admin policy create silo job-results-read /tmp/policy.json &&
    mc admin policy attach silo job-results-read --user $$MINIO_PRESIGNED_USER
  networks:
   - s3
  depends_on:
   silo:
    condition: service_healthy
 silo:
  image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
  ports:
   - "9000:9000"
  environment:
   - MINIO_ROOT_USER=${AUDIOSYSTEM_SILO_ROOT_USER}
   - MINIO_ROOT_PASSWORD=${AUDIOSYSTEM_SILO_ROOT_PASSWORD}
  volumes:
   - silo_data:/data
  healthcheck:
   test: ["CMD", "mc", "ready", "local"]
   interval: 30s
   start_period: 30s
  networks:
   - s3
  command: server /data --console-address ":9001"
 api:
  environment:
   - MINIO_SERVER=silo:9000
   - MINIO_PORT=9000
   - MINIO_ROOT_USER=${AUDIOSYSTEM_SILO_ROOT_USER}
   - MINIO_ROOT_PASSWORD=${AUDIOSYSTEM_SILO_ROOT_PASSWORD}
   - MINIO_CLIENT_BUCKET_NAME=client-sources
   - MINIO_RESULT_BUCKET_NAME=job-results
   - MINIO_PRESIGNED_USER=${AUDIOSYSTEM_SILO_PRESIGNED_USER}
   - MINIO_PRESIGNED_PASSWORD=${AUDIOSYSTEM_SILO_PRESIGNED_PASSWORD}
  networks:
   - s3
 processor:
  environment:
   - MINIO_SERVER=silo:9000
   - MINIO_ROOT_USER=${AUDIOSYSTEM_SILO_ROOT_USER}
   - MINIO_ROOT_PASSWORD=${AUDIOSYSTEM_SILO_ROOT_PASSWORD}
   - MINIO_CLIENT_BUCKET_NAME=client-sources
   - MINIO_RESULT_BUCKET_NAME=job-results
  networks:
   - s3
volumes:
 silo_data:
networks:
 s3:
  driver: bridge
