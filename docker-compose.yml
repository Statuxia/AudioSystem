services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ws-gateway
    networks:
      - interface
  api:
    build: ./api
    networks:
      - interface
  ws-gateway:
    build: ./ws-gateway
    networks:
      - interface
networks:
  interface:
    driver: bridge
