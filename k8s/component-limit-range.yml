apiVersion: v1
kind: LimitRange
metadata:
  name: default-limit-range
  namespace: audiosystem
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 500Mi
        ephemeral-storage: "1Gi"
      defaultRequest:
        cpu: 500m
        memory: 500Mi
        ephemeral-storage: "1Gi"
      max:
        cpu: "1"
        memory: 2000Mi
        ephemeral-storage: "8Gi"
      min:
        cpu: 100m
        memory: 100Mi
        ephemeral-storage: "0.5Gi"
