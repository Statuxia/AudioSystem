# Kafka StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: audiosystem
  name: kafka
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  serviceName: "kafka"
  replicas: 3
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      containers:
        - name: kafka
          image: bitnamilegacy/kafka@sha256:aa0b2aee8c5610dd1d18d48b4f1df0dbe3267b5d4c338d36c9af9cbf0529c0b0
          command:
            - /bin/bash
            - -c
            - |
              export KAFKA_CFG_NODE_ID="${POD_NAME##kafka-}"
              export KAFKA_CFG_ADVERTISED_LISTENERS="PLAINTEXT://${POD_NAME}.kafka:9092,EXTERNAL://127.0.0.1:9094"
              exec /opt/bitnami/scripts/kafka/entrypoint.sh /opt/bitnami/scripts/kafka/run.sh

          ports:
            - name: kafka
              containerPort: 9092

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_ENABLE_KRAFT
              value: "yes"
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka:9093,1@kafka-1.kafka:9093,2@kafka-2.kafka:9093"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512m -Xms512m"
            - name: KAFKA_KRAFT_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: kafka-credentials
                  key: kraft-cluster-id

          volumeMounts:
            - name: kafka-data
              mountPath: /bitnami/kafka

          resources:
            limits:
              memory: 1000Mi
              cpu: "1"
              ephemeral-storage: "2Gi"

          startupProbe:
            exec:
              command: [ "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: [ "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [ "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092" ]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 30
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi