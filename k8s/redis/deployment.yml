# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: audiosystem
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:alpine3.22
          args: [ "redis-server", "--maxmemory", "850mb" ]

          ports:
            - containerPort: 6379

          volumeMounts:
            - name: redis-data
              mountPath: /data

          resources:
            limits:
              memory: 1000Mi
              cpu: "1"
              ephemeral-storage: "2Gi"

          livenessProbe:
            exec:
              command: [ "redis-cli", "ping" ]
            periodSeconds: 10

          readinessProbe:
            exec:
              command: [ "redis-cli", "ping" ]
            periodSeconds: 5

      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
  strategy:
    type: Recreate
