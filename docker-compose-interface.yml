services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
       condition: service_healthy
      ws-gateway:
       condition: service_healthy
    networks:
      - interface
  api:
    build: ./api
    networks:
      - interface
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/health"]
      interval: 30s
      start_period: 30s
    deploy:
      resources:
        limits:
         memory: 1G
  ws-gateway:
    build: ./ws-gateway
    networks:
      - interface
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8081/health"]
      interval: 30s
      start_period: 30s
networks:
  interface:
    driver: bridge
